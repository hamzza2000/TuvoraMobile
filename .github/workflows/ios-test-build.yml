name: Build Test IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Production-optimized or fast validation build
        required: true
        type: choice
        options:
          - Debug
          - Release
        default: Release

permissions:
  contents: read

concurrency:
  group: ios-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned full ${{ inputs.configuration }} IPA
    runs-on: macos-26
    timeout-minutes: ${{ inputs.configuration == 'Release' && 75 || 30 }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: ${{ inputs.configuration }}
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure runtime properties
        if: env.RELEASE_PROPERTIES_BASE64 != ''
        run: |
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build MPVKit iOS frameworks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build

          if ! make -C MPVKit build platform=ios 2>&1 | tee build/mpvkit-build.log; then
            echo "::group::MPVKit error context"
            grep -n -i -C 8 -E 'error:|fatal:|failed|failure|exit code' \
              build/mpvkit-build.log | tail -n 160 || true
            echo "::endgroup::"
            exit 1
          fi

          for name in Libmpv Libavcodec Libavdevice Libavformat Libavfilter \
                      Libavutil Libswresample Libswscale Libplacebo; do
            framework="MPVKit/dist/release/xcframework/${name}.xcframework"
            if [[ ! -f "${framework}/Info.plist" ]]; then
              echo "Missing or incomplete ${framework}" >&2
              exit 1
            fi
          done

      - name: Upload MPVKit build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mpvkit-build-log-${{ github.sha }}
          path: build/mpvkit-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Fix Tuvora app path in packaging script
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/build-ios-ipa.sh")
          contents = path.read_text()

          old = 'app_path="${derived_data}/Build/Products/${configuration}-iphoneos/Nuvio.app"'
          new = 'app_path="${derived_data}/Build/Products/${configuration}-iphoneos/Tuvora.app"'

          if old in contents:
              path.write_text(contents.replace(old, new))
              print("Updated packaging path to Tuvora.app")
          elif new in contents:
              print("Packaging path already points to Tuvora.app")
          else:
              raise SystemExit(
                  "Could not find the expected app_path in scripts/build-ios-ipa.sh"
              )
          PY

      - name: Build unsigned full ${{ inputs.configuration }} IPA
        run: |
          (
            while sleep 60; do
              echo "::group::Build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime
              vm_stat
              ps -Ao pid,etime,%cpu,rss,command -r | head -n 12 || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT
          ./scripts/build-ios-ipa.sh

      - name: Summarize IPA
        run: |
          configuration_slug="$(printf '%s' "${IOS_CONFIGURATION}" | tr '[:upper:]' '[:lower:]')"
          ipa_path="$(find build/ios-ipa -maxdepth 1 -type f -name "*-full-${configuration_slug}.ipa" -print -quit)"

          if [[ -z "${ipa_path}" ]]; then
            echo "No IPA was produced." >&2
            exit 1
          fi

          {
            echo "## Test IPA"
            echo
            echo "- File: $(basename "${ipa_path}")"
            echo "- Size: $(du -h "${ipa_path}" | cut -f1)"
            echo "- SHA-256: $(shasum -a 256 "${ipa_path}" | awk '{print $1}')"
            echo "- Distribution: full"
            echo "- Configuration: ${IOS_CONFIGURATION}"
            echo "- Signing: unsigned"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test IPA
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-test-${{ inputs.configuration }}-ipa-${{ github.sha }}
          path: build/ios-ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
